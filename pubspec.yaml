name: trainerapp
description: >-
  TrainerApp - an offline-first Android fitness and nutrition trainer built on
  published WHO, ICMR-NIN and FSSAI guidance. All health data stays on device.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: 2.6.1

  # Local, on-device storage only. No backend, no network calls at runtime.
  sqflite: 2.4.2
  path: 1.9.1
  path_provider: 2.1.5
  shared_preferences: 2.5.3

  # Google Play Billing
  in_app_purchase: 3.2.3
  in_app_purchase_android: 0.4.0+2

  # Reminders
  flutter_local_notifications: 18.0.1
  timezone: 0.10.1
  flutter_timezone: 4.1.1

  # Charts + formatting
  fl_chart: 0.70.2
  intl: 0.20.2

  # Rest-timer feedback and data export
  vibration: 3.1.3
  share_plus: 10.1.4
  package_info_plus: 8.3.0
  url_launcher: 6.3.1
  collection: 1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
